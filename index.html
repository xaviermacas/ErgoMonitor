<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMG Real-Time Monitor</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- EMG Real-time Chart -->
        <div class="chart-container">
            <canvas id="emgChart"></canvas>
        </div>

        <!-- Pitch Angle Animation -->
        <div class="pitch-container">
            <div class="pitch-animation">
                <img id="pitchImage" src="images/Angulo0.png" alt="Pitch Angle">
            </div>
            <div class="angle-display">
                <span id="angleValue">0°</span>
            </div>
        </div>

        <!-- Fatigue Percentage Bar -->
        <div class="fatigue-container">
            <div class="fatigue-bar">
                <div id="fatigueLevel" class="fatigue-level"></div>
            </div>
            <div class="fatigue-value">
                <span id="fatiguePercentage">0%</span>
                <div class="fatigue-label">Fatiga Muscular</div>
            </div>
        </div>
    </div>

    <!-- Data Processing Scripts -->
    <script src="./js/emgProcessor.js"></script>
    <script src="./js/pitchAnimator.js"></script>
    <script src="./js/fatigueCalculator.js"></script>
    <script src="./js/dataReceiver.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
